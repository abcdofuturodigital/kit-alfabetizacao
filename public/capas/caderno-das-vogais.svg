<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2400" viewBox="0 0 1200 1600">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e6f7ff"/><stop offset="1" stop-color="#fff4df"/></linearGradient>
 <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#f8fcff"/></linearGradient>
 <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%"><feGaussianBlur in="SourceAlpha" stdDeviation="14"/><feOffset dy="16"/><feComponentTransfer><feFuncA type="linear" slope=".16"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2"/></filter>
</defs>
<rect width="1200" height="1600" fill="url(#bg)"/>
<circle cx="105" cy="170" r="95" fill="#ffd66e" opacity=".75"/><circle cx="1080" cy="290" r="125" fill="#b9e8d2" opacity=".8"/>
<path d="M0 940 Q190 820 390 930 T790 920 T1200 900 V1600 H0Z" fill="#c8efdf"/>
<path d="M0 1120 Q240 1010 480 1110 T960 1090 T1200 1080 V1600 H0Z" fill="#a7dfc8"/>
<!-- decorative stars -->
<g fill="#f4b942"><path d="M180 420l18 48 50 18-50 18-18 48-18-48-50-18 50-18z"/><path d="M1030 560l13 35 36 13-36 13-13 35-13-35-36-13 36-13z"/></g>
<g fill="#79c9e8"><circle cx="1030" cy="130" r="17"/><circle cx="250" cy="690" r="13"/><circle cx="930" cy="820" r="15"/></g>
<!-- title panel -->
<g filter="url(#shadow)">
 <rect x="75" y="65" width="1050" height="380" rx="72" fill="url(#panel)" stroke="#174c55" stroke-width="9"/>
 <rect x="105" y="95" width="990" height="320" rx="52" fill="none" stroke="#b9dfd3" stroke-width="5" stroke-dasharray="13 16"/>
 <text x="600" y="205" text-anchor="middle" font-family="Trebuchet MS,Arial,sans-serif" font-size="74" font-weight="800" fill="#174c55">CADERNO DAS</text>
 <text x="600" y="355" text-anchor="middle" font-family="Trebuchet MS,Arial,sans-serif" font-size="150" font-weight="900" letter-spacing="3" fill="#f07862">VOGAIS</text>
</g>
<!-- colorful learning cards -->
<g filter="url(#shadow)">
 <g transform="rotate(-8 250 720)"><rect x="105" y="540" width="270" height="360" rx="42" fill="#fff" stroke="#f07862" stroke-width="10"/><rect x="125" y="560" width="230" height="320" rx="30" fill="#fff5ef"/><text x="240" y="790" text-anchor="middle" font-family="Trebuchet MS,Arial,sans-serif" font-size="210" font-weight="900" fill="#ed7864">A</text></g>
 <g transform="rotate(5 600 700)"><rect x="465" y="500" width="270" height="360" rx="42" fill="#fff" stroke="#65b9df" stroke-width="10"/><rect x="485" y="520" width="230" height="320" rx="30" fill="#eef9ff"/><text x="600" y="750" text-anchor="middle" font-family="Trebuchet MS,Arial,sans-serif" font-size="210" font-weight="900" fill="#349dcc">E</text></g>
 <g transform="rotate(9 950 720)"><rect x="825" y="540" width="270" height="360" rx="42" fill="#fff" stroke="#8bc99f" stroke-width="10"/><rect x="845" y="560" width="230" height="320" rx="30" fill="#f0fbf3"/><text x="960" y="790" text-anchor="middle" font-family="Trebuchet MS,Arial,sans-serif" font-size="210" font-weight="900" fill="#55a875">I</text></g>
</g>
<!-- open workbook with O and U -->
<g filter="url(#shadow)">
 <path d="M155 1000 Q365 920 600 1010 Q835 920 1045 1000 L1045 1260 Q825 1180 600 1270 Q375 1180 155 1260Z" fill="#fff" stroke="#174c55" stroke-width="10" stroke-linejoin="round"/>
 <path d="M600 1010V1270" stroke="#c7dcd6" stroke-width="9"/>
 <text x="390" y="1170" text-anchor="middle" font-family="Trebuchet MS,Arial,sans-serif" font-size="190" font-weight="900" fill="#9c71c8">O</text>
 <text x="810" y="1170" text-anchor="middle" font-family="Trebuchet MS,Arial,sans-serif" font-size="190" font-weight="900" fill="#efa83d">U</text>
 <path d="M235 1210 Q410 1160 550 1220 M650 1220 Q800 1160 965 1210" fill="none" stroke="#d7e8e2" stroke-width="8" stroke-linecap="round"/>
</g>
<!-- subtitle panel -->
<g filter="url(#shadow)">
 <rect x="75" y="1320" width="1050" height="190" rx="48" fill="#174c55"/>
 <text x="600" y="1395" text-anchor="middle" font-family="Trebuchet MS,Arial,sans-serif" font-size="43" font-weight="800" fill="#fff">Propostas para identificar, traçar</text>
 <text x="600" y="1455" text-anchor="middle" font-family="Trebuchet MS,Arial,sans-serif" font-size="43" font-weight="800" fill="#fff">e aprender as vogais.</text>
</g>
<text x="600" y="1560" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="800" letter-spacing="3" fill="#174c55">ABC DO FUTURO DIGITAL</text>
</svg>